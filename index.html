<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>श्री शिव शक्ति गोगा गोरक्ष पीठ</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: #fdf6ee;
  font-family: 'Noto Sans Devanagari', sans-serif;
  min-height: 100vh;
  color: #2a1a08;
  -webkit-text-size-adjust: 100%;
}
#root { min-height: 100vh; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #fdf6ee; }
::-webkit-scrollbar-thumb { background: #e8a430; border-radius: 3px; }

/* ── MODAL ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(60,30,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 999;
  display: flex; align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
/* Mobile: sheet from bottom */
.modal-box {
  background: #fff;
  border-top: 3px solid #e07b00;
  width: 100%;
  max-height: 85vh;
  display: flex; flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(.4,0,.2,1);
  border-radius: 16px 16px 0 0;
}
.modal-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid #f5d99a;
  display: flex; justify-content: space-between; align-items: center;
  background: #fffbf3;
  border-radius: 16px 16px 0 0;
  position: sticky; top: 0;
}
.modal-drag {
  width: 40px; height: 4px;
  background: #e0c88a; border-radius: 2px;
  margin: 0 auto 10px;
}
.modal-title { font-family: 'Tiro Devanagari Hindi', serif; font-size: 17px; color: #c46800; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #c46800; padding: 0 4px; }
.modal-total {
  padding: 10px 20px;
  background: #fffbf3;
  border-bottom: 1px solid #f5d99a;
  font-size: 12px; color: #8a6030;
  font-family: 'DM Mono', monospace;
}
.modal-body { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.modal-table { width: 100%; border-collapse: collapse; }
.modal-table thead th {
  padding: 9px 14px;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: #b08040; background: #fffbf3;
  position: sticky; top: 0;
  border-bottom: 1px solid #f5d99a;
  font-family: 'DM Mono', monospace; text-align: left;
}
.modal-table tbody td {
  padding: 11px 14px; font-size: 13px;
  border-bottom: 1px solid #fdf1e0; vertical-align: middle;
}
.modal-table tbody tr:last-child td { border-bottom: none; }
.modal-table tbody tr:active td { background: #fffbf3; }

/* ── DESKTOP overrides ── */
@media (min-width: 700px) {
  .modal-backdrop { align-items: center; justify-content: center; padding: 20px; }
  .modal-box { max-width: 680px; border-radius: 0; border: 2px solid #e8a430; border-top: 3px solid #e07b00; max-height: 78vh; box-shadow: 8px 8px 0 #f5d99a; animation: slideUp2 0.25s ease; }
  .modal-drag { display: none; }
}

@keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
@keyframes slideUp2 { from { transform: translateY(20px); opacity:0 } to { transform: translateY(0); opacity:1 } }
@keyframes fadeUp  { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
@keyframes spin    { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0X_jQFugb9t_WYHvnVFmwt_P3qP-el48I1xVLcQRe6XaaBh1wE-7GwxpNutO-g0Hh/exec';

const C = {
  saffron: '#e07b00', saffronDeep: '#c46800', saffronLight: '#f5a623',
  saffronBg: '#fff8ee', saffronBorder: '#f0d8b0',
  green: '#2e7d4f', greenBg: '#edf7f1', greenBorder: '#a8d8be',
  red: '#b03a2e', redBg: '#fdf0ee', redBorder: '#e8b8b0',
  text: '#2a1a08', muted: '#9a7040', light: '#b08040',
};

// ── HELPERS ──
function fmt(n) {
  n = Math.abs(n);
  if (n >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
  if (n >= 100000)   return '₹' + (n/100000).toFixed(2) + ' L';
  if (n >= 1000)     return '₹' + (n/1000).toFixed(1) + 'K';
  return '₹' + n.toFixed(0);
}

function fmtDate(raw) {
  if (!raw) return '—';
  const d = new Date(raw);
  if (isNaN(d)) return raw;
  const days   = ['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
  const months = ['जन','फ़र','मार्च','अप्रैल','मई','जून','जुलाई','अग','सित','अक्टू','नव','दिसं'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function normalize(row) {
  const keys = Object.keys(row);
  const find = (...ns) => {
    for (const n of ns) {
      const k = keys.find(k => k.toLowerCase().includes(n));
      if (k !== undefined) return (row[k]||'').toString().trim();
    }
    return '';
  };
  return {
    date:     find('date','din','tarikh','तारीख'),
    category: find('category','cat','item','विवरण','श्रेणी','kaam'),
    type:     find('type','kind','प्रकार'),
    amount:   parseFloat(find('amount','amt','rupee','rs','price','value','राशि').replace(/[₹,\s]/g,'')) || 0,
    notes:    find('notes','note','remark','टिप्पणी'),
  };
}

// ── MODAL (bottom sheet on mobile) ──
function TxModal({ title, rows, onClose, color }) {
  const total = rows.reduce((s,r)=>s+r.amount,0);
  // Prevent body scroll
  useEffect(() => {
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = ''; };
  }, []);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div style={{padding:'10px 0 0',background:'#fffbf3',borderRadius:'16px 16px 0 0'}}>
          <div className="modal-drag" />
        </div>
        <div className="modal-header">
          <span className="modal-title">{title}</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-total">
          कुल: <strong style={{color,fontFamily:'DM Mono'}}>{fmt(total)}</strong>
          &nbsp;·&nbsp; {rows.length} प्रविष्टियाँ
        </div>
        <div className="modal-body">
          <table className="modal-table">
            <thead>
              <tr>
                <th>तारीख</th>
                <th>विवरण</th>
                <th style={{textAlign:'right'}}>राशि</th>
              </tr>
            </thead>
            <tbody>
              {rows.length === 0
                ? <tr><td colSpan="3" style={{textAlign:'center',padding:'32px',color:C.light}}>कोई डेटा नहीं</td></tr>
                : rows.map((r,i) => (
                  <tr key={i}>
                    <td style={{fontFamily:'DM Mono',fontSize:'11px',color:C.muted,whiteSpace:'nowrap'}}>{fmtDate(r.date)}</td>
                    <td style={{fontSize:'13px'}}>{r.category||'—'}{r.notes ? <div style={{fontSize:'11px',color:C.muted}}>{r.notes}</div> : null}</td>
                    <td style={{textAlign:'right',fontFamily:'DM Mono',fontWeight:'600',color,whiteSpace:'nowrap'}}>{fmt(r.amount)}</td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── KPI CARD ──
function KpiCard({ label, value, sub, color, bg, border, onClick, icon }) {
  const [pressed, setPressed] = useState(false);
  return (
    <div
      onClick={onClick}
      onTouchStart={()=>setPressed(true)}
      onTouchEnd={()=>setPressed(false)}
      style={{
        background: pressed ? '#fff' : bg,
        border: `1.5px solid ${border}`,
        borderTop: `3px solid ${color}`,
        padding: '16px',
        cursor: onClick ? 'pointer' : 'default',
        transition: 'all 0.15s',
        position: 'relative',
        transform: pressed ? 'scale(0.98)' : 'scale(1)',
        animation: 'fadeUp 0.4s ease both',
      }}
    >
      {onClick && (
        <div style={{position:'absolute',top:'8px',right:'10px',fontSize:'9px',color,fontFamily:'DM Mono',opacity:0.7}}>
          देखें ↗
        </div>
      )}
      <div style={{fontFamily:'DM Mono',fontSize:'10px',letterSpacing:'0.1em',color:C.muted,marginBottom:'8px'}}>
        {icon} {label}
      </div>
      <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'24px',fontWeight:'700',color,lineHeight:1}}>
        {value}
      </div>
      <div style={{marginTop:'6px',fontSize:'11px',color:C.muted,fontFamily:'DM Mono'}}>{sub}</div>
    </div>
  );
}

// ── BAR CHART ──
function BarChart({ data }) {
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (!ref.current || !data) return;
    inst.current?.destroy();
    inst.current = new Chart(ref.current, {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [
          { label: 'आय',   data: data.income,  backgroundColor: '#2e7d4f25', borderColor: C.green, borderWidth: 1.5 },
          { label: 'व्यय', data: data.expense, backgroundColor: '#b03a2e18', borderColor: C.red,   borderWidth: 1.5 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: C.muted, font: { family:'DM Mono', size:10 }, boxWidth:10 } } },
        scales: {
          x: { ticks: { color:C.muted, font:{family:'DM Mono',size:9}, maxRotation:45 }, grid: { color:'#f5e8d0' } },
          y: { ticks: { color:C.muted, font:{family:'DM Mono',size:9},
                        callback: v => v>=1000 ? '₹'+(v/1000).toFixed(0)+'K' : '₹'+v },
               grid: { color:'#f5e8d0' } }
        }
      }
    });
    return () => inst.current?.destroy();
  }, [data]);
  return <canvas ref={ref} />;
}

// ── DONUT ──
function DonutChart({ data }) {
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (!ref.current || !data) return;
    inst.current?.destroy();
    const colors = [C.saffron,'#e8590c','#c46800',C.green,'#6a5acd',C.red,'#d4a017','#5b8c5a'];
    inst.current = new Chart(ref.current, {
      type: 'doughnut',
      data: {
        labels: data.labels,
        datasets: [{ data: data.values, backgroundColor: colors.slice(0,data.labels.length), borderWidth:0, hoverOffset:5 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout:'65%',
        plugins: { legend: { position:'bottom', labels: { color:C.muted, font:{family:'DM Mono',size:9}, boxWidth:9, padding:8 } } }
      }
    });
    return () => inst.current?.destroy();
  }, [data]);
  return <canvas ref={ref} />;
}

// ── CARD WRAPPER ──
const Card = ({children, style={}}) => (
  <div style={{background:'#fff',border:`1.5px solid ${C.saffronBorder}`,padding:'16px',...style}}>
    {children}
  </div>
);
const CardTitle = ({text,sub}) => (
  <div style={{marginBottom:'14px'}}>
    <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'15px',color:C.saffronDeep}}>{text}</div>
    {sub && <div style={{fontFamily:'DM Mono',fontSize:'9px',color:C.muted,letterSpacing:'0.1em',marginTop:'2px'}}>{sub}</div>}
  </div>
);

// ── CLICKABLE SUMMARY BOX ──
function SummaryBox({ label, total, rows, subItems, color, bg, border, icon, onOpen }) {
  const [pressed, setPressed] = useState(false);
  return (
    <div
      onClick={onOpen}
      onTouchStart={()=>setPressed(true)}
      onTouchEnd={()=>setPressed(false)}
      style={{
        background: pressed ? '#fff' : bg,
        border: `1.5px solid ${border}`,
        borderTop: `3px solid ${color}`,
        padding: '16px',
        cursor: 'pointer',
        transition: 'all 0.15s',
        transform: pressed ? 'scale(0.99)' : 'scale(1)',
      }}
    >
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
        <div>
          <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'15px',color}}>{icon} {label}</div>
          <div style={{fontFamily:'DM Mono',fontSize:'9px',color:C.muted,marginTop:'2px'}}>टैप करें — सभी देखें ↗</div>
        </div>
        <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'26px',fontWeight:'700',color}}>{fmt(total)}</div>
      </div>

      {/* Preview rows */}
      <div style={{display:'flex',flexDirection:'column',gap:'0'}}>
        {subItems.slice(0,4).map((item,i)=>(
          <div key={i} style={{
            display:'flex',justifyContent:'space-between',
            padding:'7px 0',
            borderBottom: i < Math.min(subItems.length,4)-1 ? `1px solid ${border}` : 'none',
            fontSize:'12px',
          }}>
            <span style={{color:C.text}}>{item.label}</span>
            <span style={{fontFamily:'DM Mono',color,fontSize:'12px'}}>{fmt(item.value)}</span>
          </div>
        ))}
        {rows.length > 4 && (
          <div style={{fontSize:'11px',color:C.muted,fontFamily:'DM Mono',textAlign:'center',paddingTop:'8px'}}>
            + {rows.length - 4} और प्रविष्टियाँ
          </div>
        )}
        {subItems.length === 0 && (
          <div style={{fontSize:'12px',color:C.muted,textAlign:'center',padding:'12px 0'}}>डेटा नहीं</div>
        )}
      </div>
    </div>
  );
}

// ── APP ──
function App() {
  const [status,      setStatus]      = useState('loading');
  const [errorMsg,    setErrorMsg]    = useState('');
  const [allData,     setAllData]     = useState([]);
  const [modal,       setModal]       = useState(null);
  const [lastUpdated, setLastUpdated] = useState('');

  const loadData = useCallback(async () => {
    setStatus('loading');
    try {
      const res = await fetch(SCRIPT_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!Array.isArray(json)) throw new Error('Format galat hai');
      setAllData(json.map(normalize).filter(r => r.amount > 0));
      setLastUpdated(new Date().toLocaleTimeString('hi-IN', {hour:'2-digit',minute:'2-digit'}));
      setStatus('ok');
    } catch(err) {
      setErrorMsg(err.message);
      setStatus('error');
    }
  }, []);

  useEffect(() => { loadData(); }, []);

  // ── COMPUTED ──
  const income  = allData.filter(r => r.type.toLowerCase().includes('income'));
  const expense = allData.filter(r => r.type.toLowerCase().includes('expense'));
  const totalIn  = income.reduce((s,r)=>s+r.amount,0);
  const totalExp = expense.reduce((s,r)=>s+r.amount,0);
  const net      = totalIn - totalExp;

  const now = new Date();
  const thisMonth = r => { const d=new Date(r.date); return !isNaN(d)&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); };
  const monthNet = income.filter(thisMonth).reduce((s,r)=>s+r.amount,0) - expense.filter(thisMonth).reduce((s,r)=>s+r.amount,0);

  // Monthly bar
  const monthly = {};
  allData.forEach(r => {
    const d = new Date(r.date); if(isNaN(d)) return;
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!monthly[k]) monthly[k]={income:0,expense:0};
    if(r.type.toLowerCase().includes('income'))  monthly[k].income  += r.amount;
    if(r.type.toLowerCase().includes('expense')) monthly[k].expense += r.amount;
  });
  const hiM = ['जन','फ़र','मार्च','अप्रैल','मई','जून','जुलाई','अग','सित','अक्टू','नव','दिसं'];
  const mKeys = Object.keys(monthly).sort().slice(-8);
  const barData = {
    labels:  mKeys.map(k=>{ const[y,m]=k.split('-'); return hiM[+m-1]+"'"+ y.slice(2); }),
    income:  mKeys.map(k=>monthly[k].income),
    expense: mKeys.map(k=>monthly[k].expense),
  };

  // Donut
  const incCats = {};
  income.forEach(r=>{ const c=r.category||'अन्य'; incCats[c]=(incCats[c]||0)+r.amount; });
  const donutData = { labels:Object.keys(incCats).slice(0,7), values:Object.values(incCats).slice(0,7) };

  // Income preview (recent)
  const incPreview = income.slice(-5).reverse().map(r=>({label:r.category||fmtDate(r.date)||'—', value:r.amount}));

  // Expense categories
  const expCats = {};
  expense.forEach(r=>{ const c=r.category||'अन्य'; expCats[c]=(expCats[c]||0)+r.amount; });
  const expPreview = Object.entries(expCats).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cat,amt])=>({label:cat,value:amt}));

  const P = '16px'; // padding shorthand

  return (
    <div style={{minHeight:'100vh',background:'#fdf6ee',maxWidth:'600px',margin:'0 auto'}}>

      {/* ── HEADER ── */}
      <header style={{
        background:'#fff', borderBottom:`2px solid ${C.saffronBorder}`,
        padding:`14px ${P}`, position:'sticky', top:0, zIndex:100,
        display:'flex', alignItems:'center', justifyContent:'space-between',
      }}>
        <div>
          <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'15px',color:C.saffronDeep,lineHeight:1.3}}>
            🕉 श्री शिव शक्ति गोगा गोरक्ष पीठ
          </div>
          <div style={{fontFamily:'DM Mono',fontSize:'9px',color:C.muted,marginTop:'2px',letterSpacing:'0.08em'}}>
            मंदिर निर्माण — वित्त डैशबोर्ड
            {lastUpdated && <span style={{marginLeft:'8px'}}>· {lastUpdated}</span>}
          </div>
        </div>
        <button onClick={loadData} style={{
          background:'transparent', border:`1.5px solid ${C.saffron}`,
          color:C.saffron, padding:'7px 14px',
          fontFamily:'Noto Sans Devanagari', fontSize:'12px',
          cursor:'pointer', borderRadius:'2px', whiteSpace:'nowrap',
          WebkitTapHighlightColor:'transparent',
        }}>↻ रिफ्रेश</button>
      </header>

      <div style={{padding:`16px ${P} 24px`}}>

        {/* ── LOADING ── */}
        {status === 'loading' && (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'260px',gap:'14px'}}>
            <div style={{width:'32px',height:'32px',border:`3px solid ${C.saffronBorder}`,borderTopColor:C.saffron,borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
            <div style={{fontFamily:'Noto Sans Devanagari',color:C.muted,fontSize:'14px'}}>डेटा लोड हो रहा है…</div>
          </div>
        )}

        {/* ── ERROR ── */}
        {status === 'error' && (
          <div style={{background:C.redBg,border:`1.5px solid ${C.redBorder}`,padding:'24px 20px',textAlign:'center',marginTop:'20px'}}>
            <div style={{fontSize:'32px',marginBottom:'10px'}}>⚠️</div>
            <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'17px',color:C.red,marginBottom:'6px'}}>डेटा लोड नहीं हुआ</div>
            <div style={{fontFamily:'DM Mono',fontSize:'11px',color:C.muted,marginBottom:'16px'}}>{errorMsg}</div>
            <button onClick={loadData} style={{background:C.saffron,border:'none',color:'#fff',padding:'10px 24px',fontFamily:'Noto Sans Devanagari',fontSize:'14px',cursor:'pointer',borderRadius:'2px'}}>
              पुनः प्रयास करें
            </button>
          </div>
        )}

        {/* ── DASHBOARD ── */}
        {status === 'ok' && (<>

          {/* KPI GRID — 2x2 on mobile */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'14px'}}>
            <KpiCard label="कुल आय"     value={fmt(totalIn)}           sub={`${income.length} एंट्री`}      color={C.green}   bg={C.greenBg}   border={C.greenBorder}  onClick={()=>setModal('income')}  icon="💚" />
            <KpiCard label="कुल व्यय"   value={fmt(totalExp)}          sub={`${expense.length} एंट्री`}     color={C.red}     bg={C.redBg}     border={C.redBorder}    onClick={()=>setModal('expense')} icon="🔴" />
            <KpiCard label="शुद्ध बचत"  value={fmt(Math.abs(net))}     sub={net>=0?'▲ बचत':'▼ घाटा'}        color={net>=0?C.green:C.red} bg={net>=0?C.greenBg:C.redBg} border={net>=0?C.greenBorder:C.redBorder} icon="⚖️" />
            <KpiCard label="इस माह"     value={fmt(Math.abs(monthNet))} sub={monthNet>=0?'▲ बचत':'▼ घाटा'}  color={C.saffron} bg={C.saffronBg} border={C.saffronBorder} icon="📅" />
          </div>

          {/* BAR CHART */}
          <Card style={{marginBottom:'14px'}}>
            <CardTitle text="मासिक आय व व्यय" sub="माह दर माह तुलना" />
            <div style={{height:'200px'}}><BarChart data={barData}/></div>
          </Card>

          {/* DONUT */}
          <Card style={{marginBottom:'14px'}}>
            <CardTitle text="आय के स्रोत" sub="श्रेणी अनुसार" />
            <div style={{height:'200px'}}><DonutChart data={donutData}/></div>
          </Card>

          {/* INCOME SUMMARY BOX */}
          <div style={{marginBottom:'14px'}}>
            <SummaryBox
              label="कुल आय विवरण" total={totalIn} rows={income}
              subItems={incPreview} color={C.green} bg={C.greenBg}
              border={C.greenBorder} icon="💚" onOpen={()=>setModal('income')}
            />
          </div>

          {/* EXPENSE SUMMARY BOX */}
          <div style={{marginBottom:'14px'}}>
            <SummaryBox
              label="कुल व्यय विवरण" total={totalExp} rows={expense}
              subItems={expPreview} color={C.red} bg={C.redBg}
              border={C.redBorder} icon="🔴" onOpen={()=>setModal('expense')}
            />
          </div>

        </>)}
      </div>

      {/* ── FOOTER ── */}
      <footer style={{
        textAlign:'center', padding:'20px 16px 28px',
        borderTop:`1px solid ${C.saffronBorder}`,
        background:'#fff',
      }}>
        <div style={{fontFamily:'Tiro Devanagari Hindi, serif',fontSize:'20px',color:C.saffronDeep,letterSpacing:'0.05em'}}>
          🙏 जय 6411 सरकार 🙏
        </div>
        <div style={{fontFamily:'DM Mono',fontSize:'9px',color:C.muted,marginTop:'5px',letterSpacing:'0.1em'}}>
          श्री शिव शक्ति गोगा गोरक्ष पीठ — निर्माण कोष
        </div>
      </footer>

      {/* ── MODALS ── */}
      {modal === 'income' && (
        <TxModal title="💚 सभी आय प्रविष्टियाँ" rows={income} onClose={()=>setModal(null)} color={C.green} />
      )}
      {modal === 'expense' && (
        <TxModal title="🔴 सभी व्यय प्रविष्टियाँ" rows={expense} onClose={()=>setModal(null)} color={C.red} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
